# CI gate thresholds for healing reports and test policy.
# Override path with: python -m healing.ci_gates --config path/to/config.yaml

thresholds:
  # Reports matching these globs are excluded from threshold checks (smoke/manual runs).
  ignore_report_globs:
    - "missing-key-smoke.json"
    - "*-smoke.json"
    - "test_demo_total_failure.json"
  # Fail if total failed healing events across all reports exceed this.
  max_failed_events: 0
  # Warn when healed / total events exceeds this ratio (0.0–1.0).
  max_healed_ratio_warn: 0.10
  # Fail when healed ratio exceeds this (set high to disable fail-on-heal).
  max_healed_ratio_fail: 0.30
  # Minimum event count before ratio checks apply.
  min_events_for_ratio: 1
  # Warn if the same semantic key is healed in this many or more reports.
  repeat_healed_key_warn: 2

registry_lint:
  enabled: true
  fail_on_warnings: false

test_policy:
  enabled: true
  # allow: raw Playwright tests run freely (recorded by raw-learning); CI does not fail policy.
  # warn: surface raw usage as warnings; error: fail CI (strict smart-only).
  raw_mode: allow
  allowlist:
    - tests/test_demo_drag_drop.py
    - tests/test_convert_to_smart_unit.py
  # Patterns that indicate raw Playwright usage (regex).
  forbidden_patterns:
    - 'page\.locator\('
    - 'page\.get_by_[a-z_]+\('
    - 'expect\(page\.'
  # Require smart fixture in test function signatures that use interactions.
  require_smart_fixture: true

raw_learning:
  # Record raw Playwright tests without smart fixture (see tests/conftest.py).
  enabled: true
  # Generate MCP repair bundles after each raw test run (HEALING_RAW_MCP=0 to disable).
  mcp_bundles: true

# Smart tests: auto MCP bundles when healing reports have healed/failed events (HEALING_MCP_AUTO=0 to disable).
healing_mcp:
  auto_after_test: true

mcp_repair:
  default_base_url: "https://seleniumbase.io/demo_page"
  output_dir: "artifacts/mcp-repair-bundles"
