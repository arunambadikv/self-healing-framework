[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pomhealer"
version = "0.2.0"
description = "Playwright POM self-healing: capture, propose, review, and apply locator patches"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "arunambadikv" }]
dependencies = [
  "playwright",
  "pytest",
  "pytest-playwright",
  "pyyaml",
  "rich",
  "python-dotenv",
  "cursor-sdk",
  "openai",
  "mcp",
]

[project.optional-dependencies]
# Kept for older pip install 'pomhealer[propose]' commands; SDKs are now core deps.
mcp = []
openai = []
propose = []
dev = []

[project.scripts]
pomhealer-scan = "pomhealer.architecture_scan:main"
pomhealer-propose = "pomhealer.pom_propose:main"
pomhealer-mcp-propose = "pomhealer.mcp_propose_runner:main"
pomhealer-review = "pomhealer.review:main"
pomhealer-import = "pomhealer.artifact_import:main"
pomhealer-gates = "pomhealer.ci_gates:main"
pomhealer-init = "pomhealer.init:main"
pomhealer-doctor = "pomhealer.doctor:main"

[project.entry-points."pytest11"]
pomhealer = "pomhealer.pytest_plugin"

[tool.setuptools.packages.find]
include = ["pomhealer*"]

[tool.setuptools.package-data]
pomhealer = [
  "templates/**/*",
  "ci_gates_config.yaml",
]

[tool.pomhealer]
pages_dir = "pages"
tests_dir = "tests"
data_dir = "data"
artifacts_dir = "pomhealer-artifacts"
apply_roots = ["pages"]
skills_dir = ".cursor/skills"
mcp_config = ".cursor/mcp.json"
auth_dir = "pomhealer-artifacts/auth"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "optional: mark test as optional",
  "demo_session: team demo only; skipped unless pytest --run-demo-session",
  "pomhealer_demo: healing pipeline demo; skipped unless pytest --run-pomhealer-demo",
]
