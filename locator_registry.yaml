demo.text_input:
  intent: fill the main text input field
  action: fill
  preferred:
  - type: css
    value: '#myTextInput'
  fallback:
  - type: css
    value: input#myTextInput
demo.textarea:
  intent: fill the textarea
  action: fill
  preferred:
  - type: css
    value: '#myTextarea'
  fallback:
  - type: css
    value: textarea[name='textareaName']
demo.prefilled_text:
  intent: fill prefilled text field
  action: fill
  preferred:
  - type: css
    value: '#myTextInput2'
  fallback:
  - type: css
    value: input[name='preText2']
demo.placeholder_input:
  intent: fill placeholder input field
  action: fill
  preferred:
  - type: placeholder
    value: Placeholder Text Field
  fallback:
  - type: css
    value: '#placeholderText'
demo.readonly_input:
  intent: verify readonly input is visible
  action: expect_visible
  preferred:
  - type: css
    value: '#readOnlyText'
  fallback:
  - type: css
    value: input[readonly]
demo.green_button:
  intent: click the green demo button
  action: click
  preferred:
  - type: role
    role: button
    name: Click Me (Green)
  - type: role
    role: button
    name: Old Button Name
  fallback:
  - type: text
    value: Click Me (Green)
  - type: css
    value: '#myButton'
demo.paragraph_text:
  intent: verify paragraph label text is visible
  action: expect_visible
  preferred:
  - type: text
    value: 'Paragraph with Text:'
  fallback:
  - type: text
    value: 'Paragraph with Text:'
    exact: true
demo.green_text:
  intent: verify color-toggle paragraph element is visible (#pText; text changes after
