name: Architecture Heartbeat

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          playwright install chromium

      - name: Architecture scan
        run: python -m healing.architecture_scan

      - name: Upload architecture artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-manifest
          path: healer-artifacts/architecture/
          if-no-files-found: warn

      - name: Summarize
        if: always()
        run: |
          if [ -f healer-artifacts/architecture/manifest.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("healer-artifacts/architecture/manifest.json").read_text())
          print(f"content_hash={m.get('content_hash')} generated_at={m.get('generated_at')} pages={len(m.get('pages') or {})}")
          PY
          else
            echo "No manifest produced"
          fi
