name: Healing Framework CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run pytest
        run: pytest tests/ -q

      - name: Phase A — registry lint
        run: python -m healing.registry_lint

      - name: Phase A — CI gates (healing thresholds + smart test policy)
        run: python -m healing.ci_gates

      - name: Phase B — MCP repair bundles (prompts only)
        run: python -m healing.mcp_repair_pipeline
        continue-on-error: true

      - name: Upload healing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healing-artifacts
          path: |
            artifacts/healing-reports/
            artifacts/patch-suggestions/
            artifacts/mcp-repair-bundles/
          if-no-files-found: ignore
