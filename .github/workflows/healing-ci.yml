name: Healing Framework CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run pytest
        run: pytest tests/ -q

      - name: Architecture manifest
        run: python -m healing.architecture_scan

      - name: CI gates (POM policy + healing queue)
        run: python -m healing.ci_gates

      - name: Upload healing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healing-artifacts
          path: |
            artifacts/failures/
            artifacts/healing-queue/
            artifacts/architecture/
          if-no-files-found: ignore
