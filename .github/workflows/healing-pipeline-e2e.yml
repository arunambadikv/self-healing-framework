name: Healing Pipeline E2E

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Demo scenario to run"
        required: true
        default: login_button
        type: choice
        options:
          - login_button
          - authenticated_dashboard
          - saucedemo_inventory
  schedule:
    - cron: "0 8 * * 1"

jobs:
  pipeline-e2e:
    runs-on: ubuntu-latest
    env:
      HEALING_DEMO_HEADLESS: "1"
      HEALING_LLM_PROVIDER: ${{ vars.HEALING_LLM_PROVIDER || 'cursor' }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LITE_LLM_KEY: ${{ secrets.LITE_LLM_KEY }}
      HEALING_LLM_MODEL: ${{ vars.HEALING_LLM_MODEL || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          playwright install chromium

      - name: Reset intentional demo breaks
        run: python scripts/reset_healing_demos.py

      - name: Select demo test
        id: pick
        run: |
          case "${{ inputs.scenario || 'login_button' }}" in
            authenticated_dashboard)
              echo "nodeid=tests/test_orangehrm_healing.py::test_orangehrm_post_login_broken_heading" >> "$GITHUB_OUTPUT"
              ;;
            saucedemo_inventory)
              echo "nodeid=tests/test_saucedemo_healing.py::test_saucedemo_broken_inventory_add_to_cart" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "nodeid=tests/test_orangehrm_healing.py::test_orangehrm_broken_login_button" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run healing demo (expect failure)
        id: demo
        run: |
          set +e
          pytest "${{ steps.pick.outputs.nodeid }}" --run-healing-demo -v
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Intentional locator break should fail the test
          if [ "$code" -eq 0 ]; then
            echo "Expected demo test to fail (broken locator)" >&2
            exit 1
          fi
          exit 0

      - name: Assert failure artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          failures = sorted(Path("healer-artifacts/failures").glob("F-*.json"))
          assert failures, "No F-*.json captured"
          payload = json.loads(failures[-1].read_text())
          assert payload.get("healable") is True, payload.get("classification")
          print(f"ok failure={payload['failure_id']} classification={payload.get('classification')}")
          PY

      - name: Architecture scan
        run: python -m healing.architecture_scan

      - name: Stub propose
        run: python -m healing.pom_propose --process-all

      - name: Detect propose key
        id: llm
        run: |
          python - <<'PY'
          import os
          from healing.llm_config import resolve_llm_config
          cfg = resolve_llm_config()
          print(f"provider={cfg.provider}")
          print(f"has_key={'true' if cfg.has_key else 'false'}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"provider={cfg.provider}\n")
              fh.write(f"has_key={'true' if cfg.has_key else 'false'}\n")
          PY

      - name: MCP propose
        if: ${{ steps.llm.outputs.has_key == 'true' }}
        run: python -m healing.mcp_propose_runner --process-all

      - name: Assert patch_ready (when MCP ran)
        if: ${{ steps.llm.outputs.has_key == 'true' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from healing.healing_queue import list_patch_ready, is_patch_complete
          from healing.pom_apply import load_patch
          from healing.paths import QUEUE_PATCHES

          ready = list_patch_ready()
          assert ready, "Expected at least one patch_ready entry after MCP propose"
          patch_id = ready[0]["patch_id"]
          payload = load_patch(patch_id, QUEUE_PATCHES)
          proposal = payload.get("proposal") or payload
          assert is_patch_complete(proposal), "Patch still has TODO placeholders"
          print(f"ok patch_ready={patch_id}")
          PY

      - name: Stub-only note when no API key
        if: ${{ steps.llm.outputs.has_key != 'true' }}
        run: |
          echo "::warning::No API key for HEALING_LLM_PROVIDER=${{ steps.llm.outputs.provider }} — skipped MCP propose / patch_ready assert"
          ls -la healer-artifacts/healing-queue/patches/ || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healing-pipeline-e2e
          path: |
            healer-artifacts/failures/
            healer-artifacts/healing-queue/
            healer-artifacts/architecture/
            healer-artifacts/healing-reports/
            healer-artifacts/auth/
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Healing pipeline E2E"
            echo "- scenario: \`${{ inputs.scenario || 'login_button' }}\`"
            echo "- test: \`${{ steps.pick.outputs.nodeid }}\`"
            echo "- demo exit: \`${{ steps.demo.outputs.exit_code }}\`"
            echo ""
            echo "Human review/apply is **not** run in CI."
            echo "Operator: \`gh run download\` then \`healing-review --interactive\` (auto-merges into healer-artifacts/)."
          } >> "$GITHUB_STEP_SUMMARY"
